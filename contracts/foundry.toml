[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
verbosity = 2

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
mantle_mainnet = "${MANTLE_MAINNET_RPC}"
mantle_sepolia = "${MANTLE_SEPOLIA_RPC}"

[etherscan]
mantle_mainnet = { key = "${MANTLE_EXPLORER_API_KEY}", url = "https://api.mantlescan.xyz/api", chain = 5000 }
mantle_sepolia = { key = "${MANTLE_EXPLORER_API_KEY}", url = "https://api-sepolia.mantlescan.xyz/api", chain = 5003 }
